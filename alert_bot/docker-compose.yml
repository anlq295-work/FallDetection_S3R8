services:
  hearth-alert-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hearth-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ALERT_BOT_HOST=0.0.0.0
      - ALERT_BOT_PORT=8080
      - ALERT_BOT_DATA_FILE=/app/alert_bot/data/settings.json
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/alert_bot/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tùy chọn HTTPS tự động (Let's Encrypt) khi bạn có tên miền:
  # Chạy: BOT_DOMAIN=bot.tenmiencuaban.com docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    container_name: hearth-caddy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BOT_DOMAIN=${BOT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hearth-alert-bot

volumes:
  caddy_data:
  caddy_config:
