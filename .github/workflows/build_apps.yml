name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Configure Flutter Tools Maven Mirror
        run: |
          FLUTTER_BIN=$(which flutter)
          FLUTTER_DIR=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          echo "Flutter directory is: $FLUTTER_DIR"
          for f in "$FLUTTER_DIR/packages/flutter_tools/gradle/settings.gradle.kts" "$FLUTTER_DIR/packages/flutter_tools/gradle/build.gradle.kts"; do
            if [ -f "$f" ]; then
              echo "Patching Maven mirror into $f"
              sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$f"
              cat "$f"
            fi
          done

      - name: Pre-cache Kotlin Compiler Embeddable
        run: |
          DEST_DIR="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.2.20"
          JAR_DIR="$DEST_DIR/bb8331b7585e36ea311825b01a1c06860c055fd1"
          POM_DIR="$DEST_DIR/b0e635c9dc54ff7f8bee3ffe88a6e0947332d14b"
          mkdir -p "$JAR_DIR" "$POM_DIR"
          echo "Pre-caching kotlin-compiler-embeddable 2.2.20 from Google Maven Mirror..."
          curl -sSL --retry 5 --retry-delay 2 -o "$JAR_DIR/kotlin-compiler-embeddable-2.2.20.jar" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar"
          curl -sSL --retry 5 --retry-delay 2 -o "$POM_DIR/kotlin-compiler-embeddable-2.2.20.pom" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.pom"
          ls -lh "$JAR_DIR" "$POM_DIR"

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest # Chạy trực tiếp trên máy ảo macOS có sẵn Xcode của GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS App Bundle
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Code Sign IPA with Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/

          # Luon dong goi ban unsigned lam ban phat hanh cong khai
          zip -qr FallGuard_iOS_unsigned.ipa Payload

          SIGNED_SUCCESS=false
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "--> Phat hien chung chi Apple! Bat dau ky so..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "temp_pass" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "temp_pass" $KEYCHAIN_PATH

            # Them vao danh sach tim kiem keychain
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
            security default-keychain -s $KEYCHAIN_PATH

            # Giai ma p12 va mobileprovision
            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.mobileprovision

            # Cai dat mobileprovision vao app
            cp $RUNNER_TEMP/cert.mobileprovision Payload/Runner.app/embedded.mobileprovision

            # Import vao Keychain
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$P12_PASS" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_pass" $KEYCHAIN_PATH

            # Lay ten chu ky
            CERT_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "iPhone|Apple" | head -n 1 | awk -F '"' '{print $2}')
            echo "Signing with identity: $CERT_IDENTITY"

            if [ -n "$CERT_IDENTITY" ]; then
              # Trich xuat entitlements
              security cms -D -i $RUNNER_TEMP/cert.mobileprovision > $RUNNER_TEMP/profile.plist
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/profile.plist > $RUNNER_TEMP/entitlements.plist

              # Ky Frameworks
              find Payload/Runner.app/Frameworks -name "*.dylib" -o -name "*.framework" 2>/dev/null | while read -r lib; do
                codesign --force --verify --verbose --sign "$CERT_IDENTITY" --keychain $KEYCHAIN_PATH "$lib" 2>/dev/null || true
              done

              # Ky App chinh
              if codesign --force --verify --verbose --sign "$CERT_IDENTITY" --entitlements $RUNNER_TEMP/entitlements.plist --keychain $KEYCHAIN_PATH Payload/Runner.app; then
                zip -qr FallGuard_Signed.ipa Payload
                echo "--> Ky so thanh cong: FallGuard_Signed.ipa"
                SIGNED_SUCCESS=true
              fi
            fi
          fi

      - name: Upload Signed or Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-iOS-IPA
          path: mobile_app/build/ios/iphoneos/*.ipa
          if-no-files-found: error

  build-firmware:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ESP32-S3 Firmware
        run: pio run -e esp32-s3-n16r8

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-ESP32-Firmware
          path: .pio/build/esp32-s3-n16r8/firmware.bin

  publish-release:
    name: Publish GitHub Release (OTA Assets)
    needs: [build-android, build-ios, build-firmware]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-Android-APK
          path: release_assets/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-iOS-IPA
          path: release_assets/

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-ESP32-Firmware
          path: release_assets/

      - name: Filter Out Signed Files from Public Release
        run: |
          # Xoa bo file Signed khoi ban release cong khai (chi giu trong Actions Artifacts de tai ve may tinh ca nhan)
          rm -f release_assets/*_Signed.ipa release_assets/*_signed.ipa release_assets/FallGuard_Signed.ipa
          echo "Danh sach tep se publish len Release cong khai:"
          ls -la release_assets/

      - name: Copy Manifest
        run: |
          cp ios_ota/manifest.plist release_assets/

      - name: Delete old stale latest release to refresh published date
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/latest | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting old release ID: $RELEASE_ID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
          fi

      - name: Create or Update Version Release (v1.2.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Fall Guard S3R8 v1.2.0 (Phát hành ngày 08/11/2026)"
          body: |
            ## Fall Guard S3R8 v1.2.0 - Phát hành chính thức 08/11/2026
            - **Wi-Fi Direct Telemetry**: Giám sát thời gian thực & điều khiển từ xa trực tiếp qua mạng LAN cổng 80.
            - **Loại bỏ đồ thị ảo**: Xóa bỏ hoàn toàn Kinetic Graph và Phổ nhiệt giả lập; tập trung vào mô phỏng 3D tư thế thực tế và dữ liệu Flash NVS.
            - **Cập nhật In-App OTA**: Kiểm tra trực tiếp bản cập nhật qua GitHub REST API và cài đặt 1-chạm.
            - **Tệp cài đặt đính kèm**:
              - Android APK: `app-release.apk`
              - ESP32 Firmware: `firmware.bin`
              - iOS App: `FallGuard_iOS_unsigned.ipa`
          files: |
            release_assets/app-release.apk
            release_assets/*.ipa
            release_assets/manifest.plist
            release_assets/firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Fresh Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Fall Guard S3R8 Latest Release (v1.2.0 - 08/11/2026)"
          body: |
            ## Fall Guard S3R8 - Tự động cập nhật OTA (v1.2.0)
            Cập nhật ngày 08/11/2026:
            - **Android APK**: `app-release.apk` (v1.2.0 - Build 2)
            - **ESP32 Firmware**: `firmware.bin` (v1.2.0 Dual-OTA)
            - **iOS App**: `FallGuard_iOS_unsigned.ipa`
            - **Manifest**: `manifest.plist`
          files: |
            release_assets/app-release.apk
            release_assets/*.ipa
            release_assets/manifest.plist
            release_assets/firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
