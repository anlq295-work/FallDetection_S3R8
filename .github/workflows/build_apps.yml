name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công bất cứ lúc nào

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest # Chạy trực tiếp trên máy ảo macOS có sẵn Xcode của GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Archive (Unsigned IPA)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign
          
          # Đóng gói thành file .ipa chuẩn
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r FallGuard_iOS_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-iOS-IPA
          path: mobile_app/build/ios/iphoneos/FallGuard_iOS_unsigned.ipa
