name: Build & Publish Hearth (Android, iOS & ESP32-S3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', 'Pre-release*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Mức tăng phiên bản khi chạy thủ công'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: hearth-release-pipeline
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      build_number: ${{ steps.version.outputs.build_number }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      update_existing_release: ${{ steps.version.outputs.update_existing_release }}
      skip_reason: ${{ steps.version.outputs.skip_reason }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version & release eligibility
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          BUMP_INPUT: ${{ inputs.bump }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all_tags=$(git tag --list --sort=-creatordate | grep -E '^(v|Pre-release)[0-9]' || true)
          latest_tag=$(echo "$all_tags" | head -n 1 || true)
          pubspec_ver=$(grep -E '^version:' mobile_app/pubspec.yaml | head -n 1 | sed -E 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          pubspec_ver=${pubspec_ver:-2.0.1}
          code_label=$(grep -E "kAppReleaseLabel\s*=" mobile_app/lib/core/models.dart | head -n 1 | sed -E "s/.*'([^']+)'.*/\1/" || true)
          code_label=${code_label:-"v${pubspec_ver}"}

          # Lấy danh sách tệp thay đổi trong lần push này
          changed_files=""
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" || true)
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" || true)
          fi

          commit_msg=$(git log -1 --pretty=%B)

          eval "$(python3 - "$latest_tag" "$pubspec_ver" "$code_label" "$EVENT_NAME" "$REF" "$REF_NAME" "${BUMP_INPUT:-patch}" "$commit_msg" "$changed_files" <<'PY2'
          import re
          import shlex
          import sys

          def parse_semver(text, default=(2, 0, 1)):
              m = re.search(r'(\d+)\.(\d+)\.(\d+)', text or "")
              return tuple(map(int, m.groups())) if m else default

          latest_tag = sys.argv[1].strip()
          pubspec_ver = sys.argv[2].strip()
          code_label = sys.argv[3].strip()
          event_name = sys.argv[4]
          ref = sys.argv[5]
          ref_name = sys.argv[6]
          bump_input = sys.argv[7]
          commit_msg = sys.argv[8]
          changed_files = [f.strip() for f in sys.argv[9].splitlines() if f.strip()]

          tag_ver = parse_semver(latest_tag, parse_semver(pubspec_ver))
          base_ver = parse_semver(pubspec_ver)
          has_existing_tag = bool(latest_tag)

          first_line = commit_msg.splitlines()[0].strip().lower() if commit_msg.strip() else ""
          lower_msg = commit_msg.lower()

          product_prefixes = (
              "src/",
              "include/",
              "lib/",
              "mobile_app/lib/",
              "mobile_app/android/",
              "mobile_app/ios/",
              "mobile_app/assets/",
              "ios_ota/",
          )
          product_exact = {
              "platformio.ini",
              "mobile_app/pubspec.yaml",
              "mobile_app/pubspec.lock",
          }

          def is_product_file(path):
              return path in product_exact or path.startswith(product_prefixes)

          has_product_changes = any(is_product_file(f) for f in changed_files)
          explicit_skip = bool(re.search(r'\[(no-release|skip release|skip-release)\]', lower_msg))
          explicit_force = bool(re.search(r'\[(release|major|minor|patch)\]', lower_msg))
          non_release_prefix = bool(re.match(r'^(ci|docs|chore|test|style|build|refactor)(\([^)]*\))?!?:', first_line))

          should_release = True
          update_existing_release = False
          skip_reason = ""
          release_tag = ""

          if ref.startswith("refs/tags/"):
              release_tag = ref_name
              v = parse_semver(ref_name, base_ver)
              version = f"{v[0]}.{v[1]}.{v[2]}"
              should_release = True
          elif event_name == "pull_request":
              cur = max(tag_ver, base_ver)
              version = f"{cur[0]}.{cur[1]}.{cur[2]}"
              release_tag = code_label if parse_semver(code_label) == cur else f"v{version}"
              should_release = False
              update_existing_release = False
              skip_reason = "Pull Request chỉ chạy kiểm tra CI, không cập nhật Release."
          elif event_name == "workflow_dispatch":
              bump = bump_input or "patch"
              should_release = True
              if base_ver > tag_ver or (not has_existing_tag):
                  version = f"{base_ver[0]}.{base_ver[1]}.{base_ver[2]}"
                  release_tag = code_label
              else:
                  major, minor, patch = tag_ver
                  if bump == "major":
                      major, minor, patch = major + 1, 0, 0
                  elif bump == "minor":
                      minor, patch = minor + 1, 0
                  else:
                      patch += 1
                  version = f"{major}.{minor}.{patch}"
                  prefix = "Pre-release" if "pre" in latest_tag.lower() else "v"
                  release_tag = f"{prefix}{version}"
          elif ref in ("refs/heads/main", "refs/heads/master"):
              # Nếu code_label (VD: Pre-release2.0.1) mới hơn hoặc khác tag hiện tại và có version >= tag
              code_label_new = (base_ver > tag_ver) or (base_ver == tag_ver and code_label != latest_tag)
              if explicit_skip:
                  should_release = False
                  skip_reason = "Commit có từ khóa [no-release] / [skip release] -> không tăng version, cập nhật lại gói dựng trong release hiện tại."
              elif code_label_new and not non_release_prefix:
                  should_release = True
              elif non_release_prefix and not explicit_force:
                  should_release = False
                  skip_reason = f"Tiền tố commit ({first_line.split(':', 1)[0]}:) -> không tăng version, cập nhật lại gói dựng trong release hiện tại."
              elif changed_files and not has_product_changes and not explicit_force:
                  should_release = False
                  skip_reason = "Không thay đổi mã app/firmware -> không tăng version, cập nhật lại gói dựng trong release hiện tại."

              if not should_release:
                  cur = tag_ver if has_existing_tag else base_ver
                  version = f"{cur[0]}.{cur[1]}.{cur[2]}"
                  release_tag = latest_tag if has_existing_tag else code_label
                  update_existing_release = True
              elif code_label_new:
                  version = f"{base_ver[0]}.{base_ver[1]}.{base_ver[2]}"
                  release_tag = code_label
              else:
                  if re.search(r'\[major\]|breaking change', lower_msg):
                      bump = "major"
                  elif re.search(r'\[minor\]|feat(\([^)]*\))?:', lower_msg):
                      bump = "minor"
                  else:
                      bump = "patch"
                  major, minor, patch = tag_ver
                  if bump == "major":
                      major, minor, patch = major + 1, 0, 0
                  elif bump == "minor":
                      minor, patch = minor + 1, 0
                  else:
                      patch += 1
                  version = f"{major}.{minor}.{patch}"
                  prefix = "Pre-release" if "pre" in latest_tag.lower() else "v"
                  release_tag = f"{prefix}{version}"
          else:
              cur = max(tag_ver, base_ver)
              version = f"{cur[0]}.{cur[1]}.{cur[2]}"
              release_tag = code_label
              should_release = False
              update_existing_release = False
              skip_reason = f"Nhánh {ref_name} không thuộc nhánh phát hành chính."

          is_prerelease = any(k in release_tag.lower() for k in ("pre", "alpha", "beta", "rc"))

          print(f"version={shlex.quote(version)}")
          print(f"release_tag={shlex.quote(release_tag)}")
          print(f"is_prerelease={'true' if is_prerelease else 'false'}")
          print(f"should_release={'true' if should_release else 'false'}")
          print(f"update_existing_release={'true' if update_existing_release else 'false'}")
          print(f"skip_reason={shlex.quote(skip_reason)}")
          PY2
          )"

          prev_tag=$(echo "$all_tags" | grep -vx "$release_tag" | head -n 1 || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${prev_tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "update_existing_release=${update_existing_release}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"

          echo "Release Tag: ${release_tag} (numeric ${version}, build ${GITHUB_RUN_NUMBER}, prerelease=${is_prerelease})"
          echo "should_release=${should_release} | update_existing_release=${update_existing_release}"
          if [[ -n "$skip_reason" ]]; then
            echo "Note: ${skip_reason}"
          fi

  build-android:
    name: Test & Build Android APK
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & verify quality
        run: |
          cd mobile_app
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Configure Maven Mirrors via Gradle Init Script
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/mirror.init.gradle"
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              }
          }
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                          repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                          repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release \
            --build-name "${{ needs.prepare-version.outputs.version }}" \
            --build-number "${{ needs.prepare-version.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/Hearth-Android-${{ needs.prepare-version.outputs.release_tag }}-build-${{ needs.prepare-version.outputs.build_number }}.apk"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hearth-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/Hearth-Android-*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    needs: prepare-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS App Bundle
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign \
            --build-name "${{ needs.prepare-version.outputs.version }}" \
            --build-number "${{ needs.prepare-version.outputs.build_number }}"

      - name: Package Unsigned & Optional Signed IPA
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/

          RELEASE_TAG="${{ needs.prepare-version.outputs.release_tag }}"
          BUILD_NUMBER="${{ needs.prepare-version.outputs.build_number }}"

          zip -qr "Hearth-iOS-${RELEASE_TAG}-build-${BUILD_NUMBER}-unsigned.ipa" Payload

          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "--> Phát hiện chứng chỉ Apple, bắt đầu ký số IPA..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "temp_pass" "$KEYCHAIN_PATH" || true
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "temp_pass" "$KEYCHAIN_PATH"

            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            security default-keychain -s "$KEYCHAIN_PATH"

            echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.mobileprovision"

            cp "$RUNNER_TEMP/cert.mobileprovision" Payload/Runner.app/embedded.mobileprovision

            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASS" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_pass" "$KEYCHAIN_PATH"

            CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E "iPhone|Apple" | head -n 1 | awk -F '"' '{print $2}')
            echo "Signing with identity: $CERT_IDENTITY"

            if [ -n "$CERT_IDENTITY" ]; then
              security cms -D -i "$RUNNER_TEMP/cert.mobileprovision" > "$RUNNER_TEMP/profile.plist"
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

              find Payload/Runner.app/Frameworks -name "*.dylib" -o -name "*.framework" 2>/dev/null | while read -r lib; do
                codesign --force --verify --verbose --sign "$CERT_IDENTITY" --keychain "$KEYCHAIN_PATH" "$lib" 2>/dev/null || true
              done

              if codesign --force --verify --verbose --sign "$CERT_IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" --keychain "$KEYCHAIN_PATH" Payload/Runner.app; then
                zip -qr "Hearth-iOS-${RELEASE_TAG}-build-${BUILD_NUMBER}-signed.ipa" Payload
                echo "--> Ký số thành công."
              fi
            fi
          fi

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hearth-iOS-IPA
          path: mobile_app/build/ios/iphoneos/Hearth-iOS-*.ipa
          if-no-files-found: error

  build-firmware:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ESP32-S3 N16R8 Firmware
        run: pio run -e esp32-s3-n16r8

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hearth-ESP32-Firmware
          path: .pio/build/esp32-s3-n16r8/firmware.bin
          if-no-files-found: error

  publish-release:
    name: Publish or Refresh GitHub Release (OTA Assets)
    needs: [prepare-version, build-android, build-ios, build-firmware]
    runs-on: ubuntu-latest
    if: needs.prepare-version.outputs.should_release == 'true' || needs.prepare-version.outputs.update_existing_release == 'true'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        run: mkdir -p release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hearth-Android-APK
          path: release_assets/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hearth-iOS-IPA
          path: release_assets/

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hearth-ESP32-Firmware
          path: release_assets/

      - name: Filter Signed IPA & Prepare iOS Manifest
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
          BUILD_NUMBER: ${{ needs.prepare-version.outputs.build_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -f release_assets/*-signed.ipa release_assets/*-Signed.ipa release_assets/*_signed.ipa release_assets/*_Signed.ipa

          cp ios_ota/manifest.plist release_assets/manifest.plist
          python3 - "$VERSION" "$RELEASE_TAG" "$BUILD_NUMBER" "$REPO" <<'PY2'
          from pathlib import Path
          import re
          import sys

          version, release_tag, build, repo = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          ipa_name = f"Hearth-iOS-{release_tag}-build-{build}-unsigned.ipa"
          ipa_url = f"https://github.com/{repo}/releases/download/{release_tag}/{ipa_name}"
          manifest = Path("release_assets/manifest.plist")
          text = manifest.read_text(encoding="utf-8")
          text = re.sub(
              r'(<key>bundle-version</key>\s*<string>)[^<]+(</string>)',
              rf'\g<1>{version}\g<2>',
              text,
          )
          text = re.sub(
              r'(<key>url</key>\s*<string>)[^<]+(</string>)',
              rf'\g<1>{ipa_url}\g<2>',
              text,
          )
          manifest.write_text(text, encoding="utf-8")
          PY2

          echo "Danh sách tệp phát hành:"
          ls -lh release_assets/

      - name: Generate Release Notes (Per-Release Changelog & Checksums)
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
          BUILD_NUMBER: ${{ needs.prepare-version.outputs.build_number }}
          PREV_TAG: ${{ needs.prepare-version.outputs.previous_tag }}
          UPDATE_EXISTING: ${{ needs.prepare-version.outputs.update_existing_release }}
          IS_PRERELEASE: ${{ needs.prepare-version.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import datetime
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          build = os.environ["BUILD_NUMBER"]
          prev_tag = os.environ.get("PREV_TAG", "").strip()
          update_existing = os.environ.get("UPDATE_EXISTING", "false").lower() == "true"
          is_prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"
          repo = os.environ["REPO"]
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")

          apk_name = f"Hearth-Android-{release_tag}-build-{build}.apk"
          ipa_name = f"Hearth-iOS-{release_tag}-build-{build}-unsigned.ipa"

          curated_notes = ""
          changelog_path = Path("CHANGELOG.md")
          if changelog_path.exists():
              raw = changelog_path.read_text(encoding="utf-8")
              for key in (release_tag, version):
                  pattern = rf"^##\s+\[?v?{re.escape(key)}\]?.*?\n(.*?)(?=^##\s+|\Z)"
                  m = re.search(pattern, raw, flags=re.MULTILINE | re.DOTALL)
                  if m:
                      curated_notes = m.group(1).strip()
                      break

          git_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD~15..HEAD"
          try:
              log_out = subprocess.check_output(
                  ["git", "log", git_range, "--no-merges", "--pretty=format:%h|%s"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              ).strip()
          except subprocess.CalledProcessError:
              log_out = subprocess.check_output(
                  ["git", "log", "-n", "15", "--no-merges", "--pretty=format:%h|%s"],
                  text=True,
              ).strip()

          feats, fixes, others = [], [], []
          for line in log_out.splitlines():
              if "|" not in line:
                  continue
              sha, subject = line.split("|", 1)
              subject = subject.strip()
              if not subject:
                  continue
              lower = subject.lower()
              entry = f"- {subject} (`{sha}`)"
              if lower.startswith(("feat:", "feat(", "[minor]", "[major]")):
                  feats.append(entry)
              elif lower.startswith(("fix:", "fix(", "bugfix:")):
                  fixes.append(entry)
              else:
                  others.append(entry)

          assets_dir = Path("release_assets")
          asset_rows = []
          for path in sorted(assets_dir.iterdir()):
              if path.is_file():
                  size_mb = path.stat().st_size / (1024 * 1024)
                  size_str = f"{size_mb:.2f} MB" if size_mb >= 0.1 else f"{path.stat().st_size / 1024:.1f} KB"
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()[:16]
                  asset_rows.append(f"| `{path.name}` | {size_str} | `{digest}…` |")

          lines = [
              f"## Hearth (FallDetection S3R8) {release_tag}",
              "",
              f"- **Phiên bản phát hành:** `{release_tag}` (SemVer `{version}`, Build `{build}`)",
              f"- **Loại phát hành:** {'Pre-release (Bản thử nghiệm trước)' if is_prerelease else 'Official Release'}",
              f"- **Ngày cập nhật:** `{today}` (UTC)",
              *(
                  [f"- **Chế độ cập nhật:** Giữ nguyên phiên bản `{release_tag}`, làm mới tệp cài đặt từ Build `{build}`."]
                  if update_existing
                  else []
              ),
              "",
          ]

          if curated_notes:
              lines.extend(["### Điểm nổi bật của bản phát hành", "", curated_notes, ""])

          lines.append("### Chi tiết thay đổi trong bản cập nhật này")
          lines.append("")
          if feats:
              lines.extend(["#### Tính năng mới", *feats, ""])
          if fixes:
              lines.extend(["#### Sửa lỗi", *fixes, ""])
          if others:
              lines.extend(["#### Cải tiến & Thay đổi khác", *others, ""])
          if not (feats or fixes or others):
              lines.extend(["- Đồng bộ hóa bản dựng và gói cài đặt phát hành.", ""])

          lines.extend([
              "### Tệp cài đặt đính kèm",
              "",
              f"- **Android APK:** `{apk_name}` — cài đặt trực tiếp trên thiết bị Android.",
              f"- **iOS IPA (chưa ký):** `{ipa_name}` — dùng với AltStore / Sideloadly / Xcode.",
              "- **Firmware ESP32-S3 N16R8:** `firmware.bin` — hỗ trợ cập nhật qua Web OTA (`/update`), BLE OTA hoặc HTTP OTA.",
              "- **iOS OTA Manifest:** `manifest.plist`.",
              "",
              "| Tệp phát hành | Dung lượng | SHA-256 (rút gọn) |",
              "| :--- | ---: | :--- |",
              *asset_rows,
              "",
          ])

          if prev_tag:
              lines.append(
                  f"**So sánh mã nguồn đầy đủ:** https://github.com/{repo}/compare/{prev_tag}...{release_tag}"
              )

          Path("release_notes.md").write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
          print(Path("release_notes.md").read_text(encoding="utf-8"))
          PY2

      - name: Clean Up Stale Assets On Existing Release (Before Re-Upload)
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$RELEASE_TAG")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Release $RELEASE_TAG đã tồn tại (ID: $RELEASE_ID). Xóa các tệp APK/IPA/manifest/firmware cũ trước khi tải bản dựng mới lên..."
            echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test("\\.(apk|ipa|plist|bin)$")) | "\(.id) \(.name)"' | while read -r asset_id asset_name; do
              [ -z "$asset_id" ] && continue
              echo "  -> Xóa asset cũ: $asset_name (ID: $asset_id)"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases/assets/$asset_id" || true
            done
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          name: "Hearth ${{ needs.prepare-version.outputs.release_tag }}"
          body_path: release_notes.md
          prerelease: ${{ needs.prepare-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare-version.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          draft: false
          files: |
            release_assets/Hearth-Android-*.apk
            release_assets/Hearth-iOS-*-unsigned.ipa
            release_assets/manifest.plist
            release_assets/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
