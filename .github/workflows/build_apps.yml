name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when running manually'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: mobile-release-version
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 | sed 's/^v//')
          latest=${latest:-1.0.0}

          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
          else
            bump="none"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              bump="${BUMP_INPUT:-patch}"
            elif [[ "$REF" == "refs/heads/main" || "$REF" == "refs/heads/master" ]]; then
              message=$(git log -1 --pretty=%B)
              if grep -qiE '\[major\]|breaking change' <<< "$message"; then
                bump="major"
              elif grep -qiE '\[minor\]|feat:' <<< "$message"; then
                bump="minor"
              else
                bump="patch"
              fi
            fi

            version=$(python3 - "$latest" "$bump" <<'PY2'
          import re
          import sys
          current = sys.argv[1]
          bump = sys.argv[2]
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', current)
          if not match:
              raise SystemExit(f'Invalid base version: {current}')
          major, minor, patch = map(int, match.groups())
          if bump == 'major':
              major, minor, patch = major + 1, 0, 0
          elif bump == 'minor':
              minor, patch = minor + 1, 0
          elif bump == 'patch':
              patch += 1
          print(f'{major}.{minor}.{patch}')
          PY2
            )
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version $version (build ${GITHUB_RUN_NUMBER})"

  build-android:
    name: Build Android APK
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Configure Maven Mirrors via Gradle Init Script
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/mirror.init.gradle"
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              }
          }
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                          repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                          repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          EOF
          echo "Successfully created ~/.gradle/init.d/mirror.init.gradle"

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release \
            --build-name "${{ needs.prepare-version.outputs.version }}" \
            --build-number "${{ needs.prepare-version.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/FallGuard-Android-v${{ needs.prepare-version.outputs.version }}-build-${{ needs.prepare-version.outputs.build_number }}.apk"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/FallGuard-Android-*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    needs: prepare-version
    runs-on: macos-latest # Chạy trực tiếp trên máy ảo macOS có sẵn Xcode của GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS App Bundle
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign \
            --build-name "${{ needs.prepare-version.outputs.version }}" \
            --build-number "${{ needs.prepare-version.outputs.build_number }}"

      - name: Code Sign IPA with Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/

          VERSION="${{ needs.prepare-version.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare-version.outputs.build_number }}"

          # Luon dong goi ban unsigned lam ban phat hanh cong khai
          zip -qr "FallGuard-iOS-v${VERSION}-build-${BUILD_NUMBER}-unsigned.ipa" Payload

          SIGNED_SUCCESS=false
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "--> Phat hien chung chi Apple! Bat dau ky so..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "temp_pass" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "temp_pass" $KEYCHAIN_PATH

            # Them vao danh sach tim kiem keychain
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
            security default-keychain -s $KEYCHAIN_PATH

            # Giai ma p12 va mobileprovision
            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.mobileprovision

            # Cai dat mobileprovision vao app
            cp $RUNNER_TEMP/cert.mobileprovision Payload/Runner.app/embedded.mobileprovision

            # Import vao Keychain
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$P12_PASS" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_pass" $KEYCHAIN_PATH

            # Lay ten chu ky
            CERT_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "iPhone|Apple" | head -n 1 | awk -F '"' '{print $2}')
            echo "Signing with identity: $CERT_IDENTITY"

            if [ -n "$CERT_IDENTITY" ]; then
              # Trich xuat entitlements
              security cms -D -i $RUNNER_TEMP/cert.mobileprovision > $RUNNER_TEMP/profile.plist
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/profile.plist > $RUNNER_TEMP/entitlements.plist

              # Ky Frameworks
              find Payload/Runner.app/Frameworks -name "*.dylib" -o -name "*.framework" 2>/dev/null | while read -r lib; do
                codesign --force --verify --verbose --sign "$CERT_IDENTITY" --keychain $KEYCHAIN_PATH "$lib" 2>/dev/null || true
              done

              # Ky App chinh
              if codesign --force --verify --verbose --sign "$CERT_IDENTITY" --entitlements $RUNNER_TEMP/entitlements.plist --keychain $KEYCHAIN_PATH Payload/Runner.app; then
                zip -qr "FallGuard-iOS-v${VERSION}-build-${BUILD_NUMBER}-signed.ipa" Payload
                echo "--> Ky so thanh cong"
                SIGNED_SUCCESS=true
              fi
            fi
          fi

      - name: Upload Signed or Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-iOS-IPA
          path: mobile_app/build/ios/iphoneos/FallGuard-iOS-*.ipa
          if-no-files-found: error

  build-firmware:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ESP32-S3 Firmware
        run: pio run -e esp32-s3-n16r8

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallGuard-ESP32-Firmware
          path: .pio/build/esp32-s3-n16r8/firmware.bin

  publish-release:
    name: Publish GitHub Release (OTA Assets)
    needs: [prepare-version, build-android, build-ios, build-firmware]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-Android-APK
          path: release_assets/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-iOS-IPA
          path: release_assets/

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: FallGuard-ESP32-Firmware
          path: release_assets/

      - name: Filter Out Signed Files from Public Release
        run: |
          # Xoa bo file Signed khoi ban release cong khai (chi giu trong Actions Artifacts de tai ve may tinh ca nhan)
          rm -f release_assets/*_Signed.ipa release_assets/*_signed.ipa release_assets/FallGuard_Signed.ipa
          echo "Danh sach tep se publish len Release cong khai:"
          ls -la release_assets/

      - name: Copy Manifest
        run: |
          cp ios_ota/manifest.plist release_assets/
          python3 - <<'PY2'
          from pathlib import Path
          import re
          version = "${{ needs.prepare-version.outputs.version }}"
          build = "${{ needs.prepare-version.outputs.build_number }}"
          manifest = Path("release_assets/manifest.plist")
          text = manifest.read_text()
          text = re.sub(r'(<key>bundle-version</key>\s*<string>)[^<]+(</string>)', rf'\g<1>{version}\g<2>', text)
          text = text.replace('FallGuard_iOS_unsigned.ipa', f'FallGuard-iOS-v{version}-build-{build}-unsigned.ipa')
          manifest.write_text(text)
          PY2

      - name: Delete old stale latest release to refresh published date
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/latest | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting old release ID: $RELEASE_ID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
          fi

      - name: Create or Update Version Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: "Fall Guard S3R8 v${{ needs.prepare-version.outputs.version }}"
          body: |
            ## Fall Guard S3R8 v${{ needs.prepare-version.outputs.version }}
            Build: `${{ needs.prepare-version.outputs.build_number }}`
            - **Wi-Fi Direct Telemetry**: Giám sát thời gian thực & điều khiển từ xa trực tiếp qua mạng LAN cổng 80.
            - **Loại bỏ đồ thị ảo**: Xóa bỏ hoàn toàn Kinetic Graph và Phổ nhiệt giả lập; tập trung vào mô phỏng 3D tư thế thực tế và dữ liệu Flash NVS.
            - **Cập nhật In-App OTA**: Kiểm tra trực tiếp bản cập nhật qua GitHub REST API và cài đặt 1-chạm.
            - **Tệp cài đặt đính kèm**:
              - Android APK: file c? version trong t?n
              - ESP32 Firmware: `firmware.bin`
              - iOS App: file c? version trong t?n
          files: |
            release_assets/FallGuard-Android-*.apk
            release_assets/*.ipa
            release_assets/manifest.plist
            release_assets/firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Fresh Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Fall Guard S3R8 Latest Release (v${{ needs.prepare-version.outputs.version }})"
          body: |
            ## Fall Guard S3R8 - Tu dong cap nhat OTA (v${{ needs.prepare-version.outputs.version }})
            APK/IPA duoc gan version va build number tu dong:
            - **Android APK**: file c? version trong t?n
            - **ESP32 Firmware**: `firmware.bin`
            - **iOS App**: file c? version trong t?n
            - **Manifest**: `manifest.plist`
          files: |
            release_assets/FallGuard-Android-*.apk
            release_assets/*.ipa
            release_assets/manifest.plist
            release_assets/firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
